<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CardForge — Procedural Thumbnail Generator</title>
<meta name="description" content="Generate millions of unique 16:9 visual cards and thumbnails procedurally with live controls and history tracking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Anton&family=Oswald:wght@400;700&family=Montserrat:wght@700;900&family=Hind+Siliguri:wght@400;700&family=Noto+Sans+Bengali:wght@400;700&family=Russo+One&family=Righteous&family=Permanent+Marker&family=Black+Han+Sans&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-deep:#05050b;--bg-base:#0a0a14;--bg-surface:#111124;--bg-elevated:#181832;--bg-hover:#202042;
  --border-sub:rgba(255,255,255,0.05);--border-n:rgba(255,255,255,0.1);--border-b:rgba(255,255,255,0.2);
  --acc:#7c3aed;--acc-glow:rgba(124,58,237,0.3);--acc2:#06b6d4;--acc3:#f59e0b;--succ:#10b981;--danger:#ef4444;
  --txt:#f4f4ff;--txt2:#9a9abb;--txt3:#606085;
  --r-sm:6px;--r-md:10px;--r-lg:16px;
  --tr:all 0.2s cubic-bezier(0.4,0,0.2,1);
}
html,body{height:100%;background:var(--bg-deep);color:var(--txt);font-family:'Inter',sans-serif;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh}

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px;background:var(--bg-base);border-bottom:1px solid var(--border-sub);flex-shrink:0;position:relative;z-index:100}
.header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--acc),transparent)}
.logo{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;letter-spacing:-0.5px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--acc),var(--acc2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px}
.logo-text .g{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-tags{display:flex;gap:8px;align-items:center}
.tag{font-size:11px;font-weight:600;color:var(--txt3);background:var(--bg-elevated);padding:3px 9px;border-radius:20px;border:1px solid var(--border-sub)}
.tag.combo{color:var(--acc);border-color:rgba(124,58,237,0.3)}

/* MAIN */
.main{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
.sidebar{width:290px;flex-shrink:0;background:var(--bg-base);border-right:1px solid var(--border-sub);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--bg-elevated) transparent}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:var(--bg-elevated);border-radius:4px}
.s-sec{padding:14px 16px;border-bottom:1px solid var(--border-sub)}
.s-label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt3);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}

/* GEN BUTTONS */
.gen-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.btn-main{grid-column:span 3;padding:12px;background:linear-gradient(135deg,var(--acc),#5b21b6);border:none;border-radius:var(--r-md);color:#fff;font-family:'Inter',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:var(--tr);display:flex;align-items:center;justify-content:center;gap:7px;position:relative;overflow:hidden;letter-spacing:0.3px}
.btn-main::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.15),transparent);pointer-events:none}
.btn-main:hover{transform:translateY(-2px);box-shadow:0 0 25px var(--acc-glow)}
.btn-main:active{transform:translateY(0)}

.btn-sm{padding:9px 7px;background:var(--bg-elevated);border:1px solid var(--border-n);border-radius:var(--r-sm);color:var(--txt);font-family:'Inter',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:var(--tr);display:flex;align-items:center;justify-content:center;gap:4px}
.btn-sm:hover{background:var(--bg-hover);border-color:var(--border-b);transform:translateY(-1px)}
.btn-sm.s{border-color:rgba(6,182,212,0.3)}.btn-sm.s:hover{border-color:var(--acc2);box-shadow:0 0 10px rgba(6,182,212,0.15)}
.btn-sm.c{border-color:rgba(245,158,11,0.3)}.btn-sm.c:hover{border-color:var(--acc3);box-shadow:0 0 10px rgba(245,158,11,0.15)}
.btn-sm.l{border-color:rgba(16,185,129,0.3)}.btn-sm.l:hover{border-color:var(--succ);box-shadow:0 0 10px rgba(16,185,129,0.15)}
.btn-sm.f{border-color:rgba(239,68,68,0.3)}.btn-sm.f:hover{border-color:var(--danger);box-shadow:0 0 10px rgba(239,68,68,0.15)}

/* UNDO REDO */
.history-controls{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
.btn-history{padding:8px 6px;background:var(--bg-surface);border:1px solid var(--border-sub);color:var(--txt2);font-size:11px;font-weight:500;border-radius:var(--r-sm);cursor:pointer;transition:var(--tr);display:flex;align-items:center;justify-content:center;gap:5px}
.btn-history:hover:not(:disabled){background:var(--bg-hover);color:var(--txt);border-color:var(--border-b)}
.btn-history:disabled{opacity:0.35;cursor:not-allowed}

.gen-count{text-align:center;font-size:11px;color:var(--txt3);margin-top:8px}
.gen-count strong{color:var(--acc)}

/* TEXT INPUTS */
.inp-grp{display:flex;flex-direction:column;gap:5px;margin-bottom:9px}
.inp-lbl{font-size:11px;font-weight:600;color:var(--txt2);display:flex;justify-content:space-between}
.inp-lbl span.shortcut{font-size:9px;color:var(--txt3);font-weight:normal}
.txt-inp{background:var(--bg-elevated);border:1px solid var(--border-n);border-radius:var(--r-sm);color:var(--txt);font-family:'Inter',sans-serif;font-size:13px;padding:8px 11px;width:100%;transition:var(--tr);outline:none;resize:none}
.txt-inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(124,58,237,0.15)}
.txt-inp::placeholder{color:var(--txt3)}

/* AVATAR */
.av-upload{border:2px dashed var(--border-n);border-radius:var(--r-md);padding:14px;text-align:center;cursor:pointer;transition:var(--tr);margin-bottom:8px}
.av-upload:hover{border-color:var(--acc);background:rgba(124,58,237,0.05)}
.av-img-wrap{width:66px;height:66px;border-radius:50%;overflow:hidden;margin:0 auto 10px;background:var(--bg-elevated);border:2px solid var(--border-n)}
.av-img-wrap img{width:100%;height:100%;object-fit:cover}
.av-txt{font-size:11px;color:var(--txt3);line-height:1.5}
.av-txt strong{color:var(--acc);display:block;font-size:12px;margin-bottom:2px}

/* OBJECT INSPECTOR (DYNAMIC PANEL) */
.inspector-panel{background:rgba(124,58,237,0.08);border:1px solid rgba(124,58,237,0.2);border-radius:var(--r-md);padding:12px;margin-top:5px;display:none}
.inspector-panel.active{display:block;animation:slideIn 0.2s ease-out}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.insp-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.insp-row:last-child{margin-bottom:0}
.insp-val{font-size:11px;font-weight:600;color:var(--txt)}
.btn-action{padding:6px 10px;background:var(--bg-elevated);border:1px solid var(--border-n);border-radius:var(--r-sm);color:var(--txt);font-size:11px;cursor:pointer;transition:var(--tr);display:flex;align-items:center;gap:4px}
.btn-action:hover{background:var(--bg-hover);border-color:var(--border-b)}
.btn-action.del{border-color:rgba(239,68,68,0.3);color:var(--danger)}
.btn-action.del:hover{background:rgba(239,68,68,0.1);border-color:var(--danger)}
.range-inp{flex:1;height:4px;border-radius:2px;background:var(--bg-surface);outline:none;accent-color:var(--acc);cursor:pointer}
.color-inp{border:none;background:none;width:32px;height:24px;cursor:pointer;border-radius:4px}
.select-inp{background:var(--bg-elevated);border:1px solid var(--border-n);border-radius:var(--r-sm);color:var(--txt);font-size:11px;padding:4px 6px;outline:none}

/* DESIGN INFO */
.d-info{background:var(--bg-elevated);border-radius:var(--r-sm);padding:9px 12px;margin-bottom:8px}
.d-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:2px 0}
.d-lbl{color:var(--txt3)}
.d-val{color:var(--txt2);font-weight:600;font-size:10px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}

/* EXPORT */
.exp-btn{width:100%;padding:13px;background:linear-gradient(135deg,#10b981,#0d9488);border:none;border-radius:var(--r-md);color:#fff;font-family:'Inter',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:var(--tr);display:flex;align-items:center;justify-content:center;gap:8px}
.exp-btn:hover{transform:translateY(-2px);box-shadow:0 0 20px rgba(16,185,129,0.35)}
.exp-btn:active{transform:translateY(0)}

/* CANVAS AREA */
.canvas-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;background:var(--bg-deep);position:relative;overflow:hidden;padding:20px}
.canvas-area::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,0.02) 1px,transparent 1px);background-size:28px 28px;pointer-events:none}
.canvas-container-wrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%;height:100%;overflow:hidden}
.canvas-wrapper{position:relative;box-shadow:0 25px 80px rgba(0,0,0,0.85),0 0 0 1px rgba(255,255,255,0.06);border-radius:2px;max-width:100%;max-height:100%;display:flex;align-items:center;justify-content:center}
/* During export, force canvas elements to fit the wrapper visually */
.exporting .canvas-wrapper {
  aspect-ratio: 16/9;
  width: 100%;
  height: 100%;
}
.exporting .canvas-wrapper .canvas-container, .exporting .canvas-wrapper canvas {
  width: 100% !important;
  height: 100% !important;
  display: block;
}

/* HISTORY TRAY (now in sidebar) */
.history-tray-container{width:100%}
.tray-header{display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.tray-scroll{display:flex;flex-wrap:wrap;gap:5px;max-height:160px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--bg-elevated) transparent}
.tray-scroll::-webkit-scrollbar{width:3px}
.tray-scroll::-webkit-scrollbar-thumb{background:var(--bg-elevated);border-radius:4px}
.tray-item{width:calc(50% - 3px);aspect-ratio:16/9;background:var(--bg-surface);border:1px solid var(--border-n);border-radius:4px;overflow:hidden;cursor:pointer;flex-shrink:0;transition:var(--tr);position:relative;box-shadow:0 4px 10px rgba(0,0,0,0.3)}
.tray-item:hover{border-color:var(--acc);box-shadow:0 4px 12px rgba(124,58,237,0.3);transform:scale(1.02)}
.tray-item img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.tray-empty{font-size:10px;color:var(--txt3);padding:10px;text-align:center;width:100%;border:1px dashed var(--border-sub);border-radius:6px;background:rgba(255,255,255,0.01)}

/* LOADING */
.loading-ov{position:absolute;inset:0;background:rgba(5,5,11,0.85);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(5px);transition:opacity 0.25s;border-radius:1px}
.loading-ov.hidden{opacity:0;pointer-events:none}
.spinner{width:40px;height:40px;border:3px solid var(--border-n);border-top-color:var(--acc);border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg-elevated);border:1px solid var(--border-n);border-radius:var(--r-md);padding:11px 15px;font-size:13px;font-weight:500;z-index:10000;transform:translateY(16px);opacity:0;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);display:flex;align-items:center;gap:8px;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.toast.show{transform:translateY(0);opacity:1}
.toast.ok{border-color:rgba(16,185,129,0.4)}
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="logo">
      <div class="logo-icon">🃏</div>
      <div class="logo-text">Card<span class="g">Forge</span></div>
    </div>
    <div class="hdr-tags">
      <span class="tag">16:9 · 1920×1080 Export</span>
      <span class="tag combo" id="combo-tag">18.9M+ Combos</span>
    </div>
  </header>

  <div class="main">
    <aside class="sidebar">
      <!-- GENERATE -->
      <div class="s-sec">
        <div class="s-label">⚡ Generate</div>
        <button class="btn-main" onclick="generateAll()" style="width: 100%;">🎲 New Design</button>
      </div>

      <!-- BACKGROUND SETTINGS -->
      <div class="s-sec">
        <div class="s-label">🎨 Background Settings</div>
        <div class="inp-grp">
          <label class="inp-lbl" for="bg-style-select">Background Style</label>
          <select class="select-inp" id="bg-style-select" onchange="changeBGStyle(this.value)" style="width: 100%; padding: 8px;">
            <!-- Options populated dynamically in JS -->
          </select>
        </div>
        <div class="inp-grp" style="margin-top: 8px; flex-direction: row; align-items: center; gap: 8px;">
          <input type="checkbox" id="bg-vignette-toggle" onchange="toggleVignette(this.checked)" style="cursor: pointer; width: 16px; height: 16px; accent-color: var(--acc);">
          <label for="bg-vignette-toggle" class="inp-lbl" style="cursor: pointer; margin-bottom: 0; user-select: none;">Apply Vignette Overlay</label>
        </div>
      </div>



      <!-- MOTION CONTROL -->
      <div class="s-sec">
        <div class="s-label">🎬 Motion Control</div>
        <div class="inp-grp">
          <div class="inp-lbl">
            <span>Background Speed</span>
            <span id="speed-bg-val">1.0x</span>
          </div>
          <input type="range" class="range-inp" id="motion-speed-bg" min="0.0" max="4.0" step="0.1" value="1.0">
        </div>
        <div class="inp-grp" style="margin-top: 8px;">
          <div class="inp-lbl">
            <span>Elements Speed</span>
            <span id="speed-decor-val">1.0x</span>
          </div>
          <input type="range" class="range-inp" id="motion-speed-decor" min="0.0" max="4.0" step="0.1" value="1.0">
        </div>
      </div>

      <!-- AVATAR -->
      <div class="s-sec" style="display: none;">
        <div class="s-label">📷 Avatar / Photo</div>
        <div class="av-upload" onclick="document.getElementById('av-file').click()">
          <div class="av-img-wrap"><img id="av-preview" src="" alt="Avatar Preview"></div>
          <div class="av-txt"><strong>Click to Upload</strong>JPG · PNG · WEBP (Draggable)</div>
        </div>
        <input type="file" id="av-file" accept="image/*" style="display:none">
      </div>

      <!-- INFO -->
      <div class="s-sec">
        <div class="s-label">📊 Current Design</div>
        <div class="d-info">
          <div class="d-row"><span class="d-lbl">Layout</span><span class="d-val" id="i-layout">—</span></div>
          <div class="d-row"><span class="d-lbl">Color</span><span class="d-val" id="i-color">—</span></div>
          <div class="d-row"><span class="d-lbl">Background</span><span class="d-val" id="i-bg">—</span></div>
          <div class="d-row" style="display: none;"><span class="d-lbl">Font</span><span class="d-val" id="i-font">—</span></div>
        </div>
      </div>



      <!-- EXPORT -->
      <div class="s-sec" style="border-bottom: none; display: flex; flex-direction: column; gap: 8px;">
        <div class="s-label">💾 Export</div>
        <button class="exp-btn" style="background: linear-gradient(135deg, var(--acc), var(--acc2));" onclick="exportMP4(1920, 1080, '1080p')">🎬 Export 1080p MP4 (10s)</button>
        <button class="exp-btn" onclick="exportMP4(2560, 1440, '2K')">🎬 Export 2K MP4 (10s)</button>
      </div>
    </aside>

    <!-- CANVAS -->
    <div class="canvas-area" id="canvas-area">
      <div class="canvas-container-wrap">
        <div class="canvas-wrapper" id="canvas-wrapper">
          <div class="loading-ov" id="loading-ov">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 15px;">
              <div class="spinner" id="loading-spinner"></div>
              <div id="loading-text" style="font-size: 14px; font-weight: 600; color: var(--txt); letter-spacing: 0.5px;">Loading...</div>
            </div>
          </div>
          <canvas id="main-canvas"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="t-icon">✅</span><span id="t-msg"></span></div>

<script>
// ═══════════════════════════════════════════
//  CARDFORGE — Procedural Card Generator
// ═══════════════════════════════════════════
const CW = 1920, CH = 1080;
let fc, currentScale = 1, avatarURL = null, designState = {}, bgSpeedMultiplier = 1.0, decorSpeedMultiplier = 1.0, bgTime = 0, decorTime = 0, applyVignetteOverlay = false;

function hexToRgba(hex, alpha) {
  if (typeof hex !== 'string') return `rgba(0,0,0,${alpha})`;
  hex = hex.replace('#', '');
  if (hex.length === 3) {
    hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
  }
  const r = parseInt(hex.substring(0, 2), 16) || 0;
  const g = parseInt(hex.substring(2, 4), 16) || 0;
  const b = parseInt(hex.substring(4, 6), 16) || 0;
  return `rgba(${r},${g},${b},${alpha})`;
}



// ── PALETTES (63) ──────────────────────────
const PALETTES = [
  {n:'Midnight Blue',  bg:'#040d21',c1:'#0d47a1',c2:'#1565C0',c3:'#1e88e5',acc:'#FFD700'},
  {n:'Blood Moon',     bg:'#1a0000',c1:'#7f0000',c2:'#b71c1c',c3:'#d32f2f',acc:'#FF8F00'},
  {n:'Deep Violet',    bg:'#0d0020',c1:'#4a148c',c2:'#6a1b9a',c3:'#8e24aa',acc:'#E040FB'},
  {n:'Forest Dark',    bg:'#001a00',c1:'#1b5e20',c2:'#2e7d32',c3:'#388e3c',acc:'#69F0AE'},
  {n:'Dark Ember',     bg:'#1a1400',c1:'#e65100',c2:'#f57f17',c3:'#ff8f00',acc:'#FFEA00'},
  {n:'Ocean Abyss',    bg:'#000d1a',c1:'#006064',c2:'#00838f',c3:'#0097a7',acc:'#00E5FF'},
  {n:'Cyber Purple',   bg:'#050510',c1:'#6200ea',c2:'#aa00ff',c3:'#d500f9',acc:'#00E5FF'},
  {n:'Hot Magenta',    bg:'#0a0014',c1:'#c51162',c2:'#f50057',c3:'#ff4081',acc:'#FF80AB'},
  {n:'Toxic Green',    bg:'#001400',c1:'#1a4d00',c2:'#2e7d00',c3:'#388e00',acc:'#39FF14'},
  {n:'Neon Sky',       bg:'#001020',c1:'#0277bd',c2:'#0288d1',c3:'#039be5',acc:'#40C4FF'},
  {n:'Pink Bomb',      bg:'#200010',c1:'#e91e63',c2:'#f06292',c3:'#f48fb1',acc:'#FFEB3B'},
  {n:'Electric Teal',  bg:'#001014',c1:'#00695c',c2:'#00897b',c3:'#00acc1',acc:'#64FFDA'},
  {n:'Teal+Orange',    bg:'#0f1923',c1:'#1565C0',c2:'#1e88e5',c3:'#2196f3',acc:'#FF6F00'},
  {n:'Dark Amber',     bg:'#1c1410',c1:'#5d4037',c2:'#795548',c3:'#8d6e63',acc:'#BCAAA4'},
  {n:'Space Gray',     bg:'#0d1117',c1:'#21262d',c2:'#30363d',c3:'#484f58',acc:'#f0883e'},
  {n:'Dark Ocean',     bg:'#0a1628',c1:'#102a55',c2:'#1565C0',c3:'#1976d2',acc:'#4FC3F7'},
  {n:'Blue Ocean',     bg:'#000428',c1:'#003090',c2:'#004e92',c3:'#0277bd',acc:'#E8F5FF'},
  {n:'Dark Cosmos',    bg:'#0f0c29',c1:'#302b63',c2:'#24243e',c3:'#3d3d6b',acc:'#A8EDEA'},
  {n:'Night City',     bg:'#1a1a2e',c1:'#16213e',c2:'#0f3460',c3:'#1a4080',acc:'#e94560'},
  {n:'Royal Storm',    bg:'#200122',c1:'#6f0000',c2:'#a00020',c3:'#b71c1c',acc:'#FF6B6B'},
  {n:'Fire Red',       bg:'#990000',c1:'#B71C1C',c2:'#C62828',c3:'#D32F2F',acc:'#FFFF00'},
  {n:'Royal Blue',     bg:'#003087',c1:'#0D47A1',c2:'#1565C0',c3:'#1976D2',acc:'#FFD700'},

  ()=>{}, // Removed scattered rectangles to prevent clutter and keep bg clean for text/photos

// Decoration helpers with animation initialization
function initDecorAnim(obj, type) {
  obj.isDecor = true;
  obj.baseScale = obj.scaleX || 1.0;
  
  // Drift velocity (slow, elegant drifting)
  obj.vx = (Math.random() - 0.5) * 0.9;
  obj.vy = (Math.random() - 0.5) * 0.9;
  
  // Rotation (for shapes that have angles)
  if (type === 'tri' || type === 'star' || type === 'rect') {
    obj.rotationSpeed = (Math.random() > 0.5 ? 1 : -1) * (0.3 + Math.random() * 0.6);
  }
  
  // Pulsing scale/opacity (circles, stars, glow)
  if (type === 'circ' || type === 'glow' || type === 'star') {
    obj.pulseSpeed = 0.01 + Math.random() * 0.015;
    obj.pulseRange = 0.03 + Math.random() * 0.05;
    obj.pulsePhase = Math.random() * Math.PI * 2;
  }
}

function setupOscillation(obj, dx, dy, speed, phase, angleRange = 0, angleSpeed = 0, anglePhase = 0) {
  obj.isDecor = true;
  obj.oscillate = true;
  obj.ox = obj.left;
  obj.oy = obj.top;
  obj.dx = dx;
  obj.dy = dy;
  obj.oscillateSpeed = speed;
  obj.oscillatePhase = phase;
  
  if (angleRange !== 0) {
    obj.oscillateAngle = true;
    obj.baseAngle = obj.angle || 0;
    obj.oscillateAngleRange = angleRange;
    obj.oscillateAngleSpeed = angleSpeed || speed;
    obj.oscillateAnglePhase = anglePhase || phase;
  }
}

function addRect(x,y,w,h,col,op,canAnim=true){
  const obj = new fabric.Rect({left:x,top:y,width:w,height:h,fill:col,opacity:op});
  obj.selectable = false; obj.evented = false;
  if(canAnim) initDecorAnim(obj, 'rect');
  fc.add(obj);
  return obj;
}
function addCirc(cx,cy,r,col,op,canAnim=true){
  const obj = new fabric.Circle({left:cx,top:cy,radius:r,fill:col,opacity:op,originX:'center',originY:'center'});
  obj.selectable = false; obj.evented = false;
  if(canAnim) initDecorAnim(obj, 'circ');
  fc.add(obj);
  return obj;
}
function addTri(cx,cy,w,h,col,op,ang,canAnim=true){
  const obj = new fabric.Triangle({left:cx,top:cy,width:w,height:h,fill:col,opacity:op,angle:ang,originX:'center',originY:'center'});
  obj.selectable = false; obj.evented = false;
  if(canAnim) initDecorAnim(obj, 'tri');
  fc.add(obj);
  return obj;
}
function addLine(x1,y1,x2,y2,col,op,sw,canAnim=true){
  const obj = new fabric.Line([x1,y1,x2,y2],{
    stroke:col,
    opacity:op,
    strokeWidth:sw,
    originX:'center',
    originY:'center'
  });
  obj.selectable = false; obj.evented = false;
  if(canAnim) initDecorAnim(obj, 'line');
  fc.add(obj);
  return obj;
}
function addStar(cx,cy,r,pts,col,op,canAnim=true){
  const pp=[];
  for(let i=0;i<pts*2;i++){
    const ra=i%2===0?r:(pts===4?r*0.15:(pts===6?r*0.22:r*0.28));
    const a=(i/(pts*2))*Math.PI*2-Math.PI/2;
    pp.push({x:Math.cos(a)*ra,y:Math.sin(a)*ra});
  }
  const obj = new fabric.Polygon(pp,{
    left:cx,
    top:cy,
    fill:col,
    opacity:op,
    originX:'center',
    originY:'center',
    selectable:false,
    evented:false
  });
  if(canAnim) initDecorAnim(obj, 'star');
  fc.add(obj);
  return obj;
}
function addGlow(cx,cy,r,col,op,canAnim=true){
  const group = [];
  const vx = (Math.random() - 0.5) * 0.65;
  const vy = (Math.random() - 0.5) * 0.65;
  const pulseSpeed = 0.008 + Math.random() * 0.012;
  const pulseRange = 0.03 + Math.random() * 0.04;
  const pulsePhase = Math.random() * Math.PI * 2;
  
  for(let i=3;i>=1;i--) {
    const circ = new fabric.Circle({
      left:cx,top:cy,radius:r*(i/3),fill:col,opacity:op/i,originX:'center',originY:'center',
      selectable:false,evented:false
    });
    if(canAnim) {
      circ.isDecor = true;
      circ.baseScale = circ.scaleX || 1.0;
      circ.vx = vx;
      circ.vy = vy;
      circ.pulseSpeed = pulseSpeed;
      circ.pulseRange = pulseRange;
      circ.pulsePhase = pulsePhase;
    }
    fc.add(circ);
    group.push(circ);
  }
  return group;
}

// ── BACKGROUND RENDERER ────────────────────
const bgCv=document.createElement('canvas');bgCv.width=CW;bgCv.height=CH;
const bgCx=bgCv.getContext('2d');

// Film grain pattern generated once for maximum performance
const noiseCv = document.createElement('canvas');
noiseCv.width = 128; noiseCv.height = 128;
const noiseCx = noiseCv.getContext('2d');
const noiseImgData = noiseCx.createImageData(128, 128);
const nd = noiseImgData.data;
for(let i=0; i<nd.length; i+=4) {
  const val = Math.floor(Math.random() * 255);
  nd[i] = val; nd[i+1] = val; nd[i+2] = val; nd[i+3] = 18; // low opacity noise
}
noiseCx.putImageData(noiseImgData, 0, 0);
const noisePat = bgCx.createPattern(noiseCv, 'repeat');

function renderBG(bs,p,t=0){
  const x=bgCx,W=bgCv.width,H=bgCv.height,bg=p.bg,c1=p.c1,c2=p.c2,c3=p.c3,acc=p.acc;
  x.clearRect(0,0,W,H);
  function lin(angle,stops){const r=(angle-90)*Math.PI/180,cx=W/2,cy=H/2,len=Math.max(W,H),x1=cx-Math.cos(r)*len/2,y1=cy-Math.sin(r)*len/2,x2=cx+Math.cos(r)*len/2,y2=cy+Math.sin(r)*len/2,g=bgCx.createLinearGradient(x1,y1,x2,y2);stops.forEach(([o,c])=>g.addColorStop(o,c));return g;}
  function solid(c){x.fillStyle=c;x.fillRect(0,0,W,H);}
  
  switch(bs.id){
    case 'solid': solid(bg); break;
    case 'lin45':case 'lin135':case 'lin90':case 'lin180': 
      x.fillStyle=lin(bs.angle + t * 0.12,[[0,bg],[1,c1]]);x.fillRect(0,0,W,H); break;
    case 'lin3': 
      x.fillStyle=lin((bs.angle||120) + t * 0.12,[[0,bg],[0.5,c1],[1,c2]]);x.fillRect(0,0,W,H); break;
    case 'rad_c':{
      const g=bgCx.createRadialGradient(W/2 + Math.cos(t*0.015)*60,H/2 + Math.sin(t*0.01)*40,0,W/2,H/2,Math.max(W,H)*(0.72 + Math.sin(t*0.008)*0.06));
      g.addColorStop(0,c2);g.addColorStop(0.6,c1);g.addColorStop(1,bg);x.fillStyle=g;x.fillRect(0,0,W,H);break;
    }
    case 'rad_corner':{
      const g=bgCx.createRadialGradient(Math.cos(t*0.01)*50,Math.sin(t*0.015)*50,0,0,0,Math.max(W,H)*(1.0 + Math.sin(t*0.007)*0.08));
      g.addColorStop(0,c2);g.addColorStop(0.55,c1);g.addColorStop(1,bg);x.fillStyle=g;x.fillRect(0,0,W,H);break;
    }
    case 'rad_multi':{
      solid(bg);
      [[W*0.2 + Math.sin(t*0.01)*80, H*0.3 + Math.cos(t*0.012)*60, 400 + Math.sin(t*0.015)*50, c2],
       [W*0.8 + Math.cos(t*0.014)*100, H*0.7 + Math.sin(t*0.009)*80, 350 + Math.cos(t*0.018)*40, c1],
       [W*0.5 + Math.sin(t*0.016)*70, H*0.1 + Math.cos(t*0.02)*40, 300 + Math.sin(t*0.022)*30, c3]].forEach(([px,py,r,col])=>{
        const g=bgCx.createRadialGradient(px,py,0,px,py,r);
        g.addColorStop(0,col+'aa');g.addColorStop(1,hexToRgba(col,0));x.fillStyle=g;x.fillRect(0,0,W,H);
      });
      break;
    }
    case 'grid':case 'grid_h':case 'grid_m':{
      x.fillStyle=lin(135 + t * 0.12,[[0,bg],[1,c1]]);x.fillRect(0,0,W,H);
      x.strokeStyle=acc;x.lineWidth=bs.lw||2.0;x.globalAlpha=bs.op||0.60;
      const gs=bs.gs||60;
      const dx=(t*0.35)%gs, dy=(t*0.25)%gs;
      for(let i=dx-gs*2;i<=W+gs*2;i+=gs){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke();}
      for(let i=dy-gs*2;i<=H+gs*2;i+=gs){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke();}
      x.globalAlpha=1;break;
    }
    case 'dots':case 'dots_l':{
      x.fillStyle=lin(135 + t * 0.12,[[0,bg],[1,c1]]);x.fillRect(0,0,W,H);
      x.fillStyle=acc;x.globalAlpha=bs.op||0.70;
      const sp=bs.sp||28,dr=bs.dr||3.5;
      const dx=(t*0.3)%sp, dy=(t*0.2)%sp;
      for(let px=dx-sp*2;px<W+sp*2;px+=sp){
        for(let py=dy-sp*2;py<H+sp*2;py+=sp){
          x.beginPath();x.arc(px,py,dr,0,Math.PI*2);x.fill();
        }
      }
      x.globalAlpha=1;break;
    }
    case 'diag':case 'diag_t':{
      x.fillStyle=lin(135 + t * 0.12,[[0,bg],[1,c1]]);x.fillRect(0,0,W,H);
      x.globalAlpha=0.28;x.fillStyle=acc;
      const sw=bs.sw||28;
      const dx=(t*0.4)%(sw*2);
      for(let i=-H-sw*2+dx;i<W+H;i+=sw*2){
        x.beginPath();x.moveTo(i,0);x.lineTo(i+sw,0);x.lineTo(i+sw+H,H);x.lineTo(i+H,H);x.closePath();x.fill();
      }
      x.globalAlpha=1;break;
    }
    case 'cross':{
      x.fillStyle=lin(135 + t * 0.12,[[0,bg],[1,c1]]);x.fillRect(0,0,W,H);
      x.strokeStyle=acc;x.lineWidth=2.0;x.globalAlpha=bs.op||0.55;
      const sz=40;
      const dx=(t*0.35)%sz;
      for(let i=dx-sz*2;i<W+sz*2;i+=sz){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke();}
      for(let i=dx-sz*2;i<H+sz*2;i+=sz){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke();}
      for(let i=-H-sz*2+dx;i<W+H+sz*2;i+=sz){
        x.beginPath();x.moveTo(i,0);x.lineTo(i+H,H);x.stroke();
        x.beginPath();x.moveTo(i+H,0);x.lineTo(i,H);x.stroke();
      }
      x.globalAlpha=1;break;
    }
    case 'tri':{
      x.fillStyle=lin(135 + t * 0.12,[[0,bg],[1,c1]]);x.fillRect(0,0,W,H);
      const ts=bs.sz||80;x.globalAlpha=bs.op||0.45;let row=0;
      const dy=(t*0.3)%(ts*0.866), dx=(t*0.15)%ts;
      for(let py=-ts*2+dy;py<H+ts*2;py+=ts*0.866){
        for(let px=-ts*2+(row%2===0?0:ts/2)+dx;px<W+ts*2;px+=ts){
          x.fillStyle=acc;x.beginPath();x.moveTo(px,py);x.lineTo(px+ts/2,py+ts*0.866);x.lineTo(px-ts/2,py+ts*0.866);x.closePath();x.fill();
        }
        row++;
      }
      x.globalAlpha=1;break;
    }
    case 'hex':{
      x.fillStyle=lin(135 + t * 0.12,[[0,bg],[1,c1]]);x.fillRect(0,0,W,H);
      const hs=bs.sz||60,hw=hs*2,hh=Math.sqrt(3)*hs;
      x.strokeStyle=acc;x.lineWidth=2.0;x.globalAlpha=bs.op||0.60;
      const dx=(t*0.3)%hw, dy=(t*0.17)%hh;
      const colStart = -4;
      const colEnd = Math.ceil(W / (hw * 0.75)) + 4;
      const rowStart = -4;
      const rowEnd = Math.ceil(H / hh) + 4;
      for(let row=rowStart;row<rowEnd;row++){
        for(let col=colStart;col<colEnd;col++){
          const hx=col*hw*0.75+(row%2)*hw*0.375+dx,hy=row*hh+dy;
          x.beginPath();
          for(let i=0;i<6;i++){
            const a=(i*60-30)*Math.PI/180;
            i===0?x.moveTo(hx+hs*Math.cos(a),hy+hs*Math.sin(a)):x.lineTo(hx+hs*Math.cos(a),hy+hs*Math.sin(a));
          }
          x.closePath();x.stroke();
        }
      }
      x.globalAlpha=1;break;
    }
    case 'conc':{
      solid(bg);x.strokeStyle=acc;x.globalAlpha=bs.op||0.65;
      const roff = (t * 0.5) % 60;
      for(let r=40+roff;r<Math.max(W,H);r+=60){
        x.lineWidth=3.0;x.beginPath();x.arc(W/2,H/2,r,0,Math.PI*2);x.stroke();
      }
      x.globalAlpha=1;break;
    }
    case 'wavy':{
      x.fillStyle=lin(135 + t * 0.12,[[0,bg],[1,c1]]);x.fillRect(0,0,W,H);
      const cnt=bs.cnt||8;x.strokeStyle=acc;x.lineWidth=4.0;x.globalAlpha=bs.op||0.55;
      for(let i=0;i<cnt;i++){
        const yb=(H/cnt)*i;x.beginPath();
        for(let px=0;px<=W;px+=5){
          const py=yb+Math.sin((px/W)*Math.PI*4+i+t*0.025)*40;
          px===0?x.moveTo(px,py):x.lineTo(px,py);
        }
        x.stroke();
      }
      x.globalAlpha=1;break;
    }
    case 'noise':{
      x.fillStyle=lin(135 + t * 0.12,[[0,bg],[1,c1]]);x.fillRect(0,0,W,H);
      // Main static noise overlay will automatically apply below at higher opacity
      break;
    }
    case 'dsplit':{
      solid(bg);x.fillStyle=c1;
      const splitOffset = Math.sin(t*0.012)*50;
      x.beginPath();x.moveTo(W*0.55+splitOffset,0);x.lineTo(W,0);x.lineTo(W,H);x.lineTo(W*0.35+splitOffset,H);x.closePath();x.fill();
      x.fillStyle=lin(135,[[0,hexToRgba(bg,0)],[1,bg+'80']]);x.fillRect(0,0,W,H);break;
    }
    case 'vignette':
    case 'vignette_soho':{
      x.fillStyle=lin(135 + t * 0.12,[[0,bg],[1,c1]]);x.fillRect(0,0,W,H);
      const vg=bgCx.createRadialGradient(W/2,H/2,H*(0.3 + Math.sin(t*0.008)*0.02),W/2,H/2,H*(0.95 + Math.sin(t*0.01)*0.03));
      vg.addColorStop(0,'transparent');vg.addColorStop(1,'rgba(0,0,0,0.72)');x.fillStyle=vg;x.fillRect(0,0,W,H);break;
    }
    case 'cglow':{
      solid(bg);
      [[Math.sin(t*0.008)*80,Math.cos(t*0.008)*80,c2],
       [W+Math.cos(t*0.01)*100,Math.sin(t*0.01)*60,c1],
       [W+Math.sin(t*0.012)*90,H+Math.cos(t*0.012)*90,c3],
       [Math.cos(t*0.007)*70,H+Math.sin(t*0.007)*80,c2]].forEach(([px,py,col])=>{
        const g=bgCx.createRadialGradient(px,py,0,px,py,620);
        g.addColorStop(0,col+'50');g.addColorStop(1,hexToRgba(col,0));x.fillStyle=g;x.fillRect(0,0,W,H);
      });
      break;
    }
    case 'circuit':{
      x.fillStyle=lin(180 + t * 0.1,[[0,bg],[1,c1]]);x.fillRect(0,0,W,H);
      x.strokeStyle=acc;x.lineWidth=2.0;x.globalAlpha=bs.op||0.55;
      const gs=60;
      const dx=(t*0.12)%gs, dy=(t*0.12)%gs;
      for(let px=-gs*2;px<W+gs*2;px+=gs){
        for(let py=-gs*2;py<H+gs*2;py+=gs){
          // Deterministic pseudo-random value based on grid coordinate to prevent flickering
          const val = Math.abs(Math.sin((px + 500) * 12.9898 + (py + 500) * 78.233) * 43758.5453) % 1;
          if(val > 0.58){
            x.beginPath();x.moveTo(px+dx,py+dy);
            const dirs=[[gs,0],[-gs,0],[0,gs],[0,-gs]];
            const dirIdx = Math.floor(val * 100) % dirs.length;
            const d = dirs[dirIdx];
            x.lineTo(px+d[0]+dx,py+d[1]+dy);x.stroke();
            x.beginPath();x.arc(px+dx,py+dy,3,0,Math.PI*2);x.fill();
          }
        }
      }
      x.globalAlpha=1;break;
    }
    case 'mesh':{
      solid(bg);
      [[W*0.2 + Math.sin(t*0.008)*120, H*0.2 + Math.cos(t*0.01)*120, c1],
       [W*0.8 + Math.cos(t*0.012)*150, H*0.2 + Math.sin(t*0.008)*90, c2],
       [W*0.5 + Math.sin(t*0.015)*130, H*0.5 + Math.cos(t*0.016)*130, c3],
       [W*0.2 + Math.cos(t*0.011)*100, H*0.8 + Math.sin(t*0.008)*120, c2],
       [W*0.8 + Math.sin(t*0.018)*120, H*0.8 + Math.cos(t*0.014)*120, c1]].forEach(([px,py,col])=>{
        const g=bgCx.createRadialGradient(px,py,0,px,py,Math.max(W,H)*0.6);
        g.addColorStop(0,col+'60');g.addColorStop(1,hexToRgba(col,0));x.fillStyle=g;x.fillRect(0,0,W,H);
      });
      break;
    }
    default: x.fillStyle=lin(135 + t * 0.12,[[0,bg],[1,c1]]);x.fillRect(0,0,W,H);
  }

  // Apply global vignette overlay if enabled (unless it is already a vignette style background)
  if (applyVignetteOverlay && bs.id !== 'vignette' && bs.id !== 'vignette_soho') {
    const vg=bgCx.createRadialGradient(W/2,H/2,H*(0.3 + Math.sin(t*0.008)*0.02),W/2,H/2,H*(0.95 + Math.sin(t*0.01)*0.03));
    vg.addColorStop(0,'transparent');vg.addColorStop(1,'rgba(0,0,0,0.72)');
    x.save();
    x.fillStyle=vg;
    x.fillRect(0,0,W,H);
    x.restore();
  }

  // Apply rich film grain overlay to ALL styles
  x.save();
  x.fillStyle = noisePat;
  x.globalAlpha = bs.id === 'noise' ? 0.38 : 0.05; // stronger opacity for dedicated noise style, subtle texture for all
  x.fillRect(0, 0, W, H);
  x.restore();

  // Universal dark overlay — tones down all backgrounds
  x.save();
  x.fillStyle = 'rgba(0,0,0,0.28)';
  x.fillRect(0, 0, W, H);
  x.restore();
}

// ── CANVAS SCALE ──────────────────────────────
function updateScale(){
  const area = document.getElementById('canvas-area');
  const ar   = area.getBoundingClientRect();

  // History tray is now in sidebar — canvas-area is all canvas
  const aW = ar.width  - 40; // subtract left+right padding (2×20px)
  const aH = ar.height - 40; // subtract top+bottom padding  (2×20px)

  // Fit canvas while maintaining 16:9, no clipping, no horizontal gaps
  currentScale = Math.min(aW / CW, aH / CH, 1.0);

  fc.setDimensions({width: CW * currentScale, height: CH * currentScale});
  fc.setZoom(currentScale);

  // Explicitly size the wrapper so the flex container centres it correctly
  const wrapper = document.getElementById('canvas-wrapper');
  if(wrapper){
    wrapper.style.width  = (CW * currentScale) + 'px';
    wrapper.style.height = (CH * currentScale) + 'px';
  }
}


function addTextBacking(layout, pal) {
  const zone = layout.ti;
  if (!zone) return;
  
  let rect;
  if (zone.a === 'center') {
    const isBottom = zone.y > CH / 2;
    const grad = new fabric.Gradient({
      type: 'linear',
      gradientUnits: 'pixels',
      coords: isBottom ? { x1: 0, y1: CH, x2: 0, y2: CH * 0.35 } : { x1: 0, y1: 0, x2: 0, y2: CH * 0.65 },
      colorStops: [
        { offset: 0, color: 'rgba(0,0,0,0.92)' },
        { offset: 0.5, color: 'rgba(0,0,0,0.55)' },
        { offset: 1, color: 'rgba(0,0,0,0)' }
      ]
    });
    rect = new fabric.Rect({
      left: 0,
      top: isBottom ? CH * 0.3 : 0,
      width: CW,
      height: CH * 0.7,
      fill: grad,
      selectable: false,
      evented: false,
      id: 'text-backing-gradient'
    });
  } else {
    const isRightSide = zone.x >= CW / 2;
    const grad = new fabric.Gradient({
      type: 'linear',
      gradientUnits: 'pixels',
      coords: isRightSide ? { x1: CW, y1: 0, x2: CW * 0.35, y2: 0 } : { x1: 0, y1: 0, x2: CW * 0.65, y2: 0 },
      colorStops: [
        { offset: 0, color: 'rgba(0,0,0,0.92)' },
        { offset: 0.45, color: 'rgba(0,0,0,0.55)' },
        { offset: 1, color: 'rgba(0,0,0,0)' }
      ]
    });
    rect = new fabric.Rect({
      left: isRightSide ? CW * 0.25 : 0,
      top: 0,
      width: CW * 0.75,
      height: CH,
      fill: grad,
      selectable: false,
      evented: false,
      id: 'text-backing-gradient'
    });
  }
  fc.add(rect);
}

async function renderDesign(ds){
  setLoading(true);
  const {pal,bg,layout,fs,di}=ds;
  
  // Sync UI controls
  applyVignetteOverlay = ds.vignetteOverlay || false;
  const selectEl = document.getElementById('bg-style-select');
  if (selectEl) selectEl.value = bg.id;
  const toggleEl = document.getElementById('bg-vignette-toggle');
  if (toggleEl) toggleEl.checked = applyVignetteOverlay;

  document.getElementById('i-layout').textContent=layout.n;
  document.getElementById('i-color').textContent=pal.n;
  document.getElementById('i-bg').textContent=bg.n;
  document.getElementById('i-font').textContent=fs.n;
  
  // Clear canvas and reset selection
  fc.clear();

  // 1. Background
  renderBG(bg,pal,bgTime);
  const bgImg = new fabric.Image(bgCv, {
    left: 0,
    top: 0,
    selectable: false,
    evented: false,
    id: 'background'
  });
  fc.add(bgImg);



  // 4. Decorations
  DECORS[di](pal);

  // 5. Avatar (Skipped per user request - no photo / avatar is rendered)

  fc.renderAll();
  setLoading(false);
}

function bringToFront() {
  const active = fc.getActiveObject();
  if (active) {
    active.bringToFront();
    // Re-ensure text layers stay very top
    const textObjects = fc.getObjects().filter(o => o.id === 'title' || o.id === 'sub');
    textObjects.forEach(t => t.bringToFront());
    fc.renderAll();
    toast('🔼', 'Moved layer to front');
  }
}

function sendToBack() {
  const active = fc.getActiveObject();
  if (active && active.id !== 'background') {
    active.sendToBack();
    // background layer must always stay absolute bottom
    const bg = fc.getObjects().find(o => o.id === 'background');
    if (bg) bg.sendToBack();
    fc.renderAll();
    toast('🔽', 'Moved layer to back');
  }
}

function deleteSelected() {
  const active = fc.getActiveObject();
  if (active) {
    if (active.id === 'background') {
      toast('❌', 'Cannot delete background layer');
      return;
    }
    fc.remove(active);
    fc.discardActiveObject();
    fc.renderAll();
    toast('🗑️', 'Object deleted');
  }
}

// ── RANDOM HELPERS ────────────────────────
function rnd(arr){return arr[Math.floor(Math.random()*arr.length)];}
function rndI(mn,mx){return Math.floor(Math.random()*(mx-mn+1))+mn;}

function getRandomDecor(bg) {
  const patternedIds = ['grid', 'grid_h', 'grid_m', 'dots', 'dots_l', 'diag', 'diag_t', 'cross', 'tri', 'hex', 'conc', 'wavy', 'circuit'];
  const isPlain = !patternedIds.includes(bg.id);
  
  if (isPlain) {
    // Exclude 0 (none), 7 (top/bottom border), 8 (left/right border), 9 (corner ticks), 18 (frame border)
    const substantialDecors = [1, 2, 3, 4, 5, 6, 10, 11, 12, 13, 14, 15, 16, 17, 19];
    return substantialDecors[Math.floor(Math.random() * substantialDecors.length)];
  } else {
    return Math.floor(Math.random() * DECORS.length);
  }
}

function mkState(){
  const bg = rnd(BG_STYLES);
  return {
    pal: rnd(PALETTES),
    bg: bg,
    layout: rnd(LAYOUTS),
    fs: rnd(FONT_STYLES),
    di: getRandomDecor(bg),
    vignetteOverlay: applyVignetteOverlay
  };
}

}

function setRecordingProgress(show, percent, label = '2K') {
  const overlay = document.getElementById('loading-ov');
  const spinner = document.getElementById('loading-spinner');
  const text = document.getElementById('loading-text');
  
  if (show) {
    spinner.style.display = 'none';
    text.textContent = `Recording ${label} Video: ${percent}%`;
    overlay.classList.remove('hidden');
  } else {
    spinner.style.display = 'block';
    text.textContent = 'Loading...';
    overlay.classList.add('hidden');
  }
}

async function exportMP4(targetWidth, targetHeight, label) {
  const wasAnimating = isAnimating;
  
  // Pause the normal preview animation loop to prevent interference
  isAnimating = false;
  if (animFrameId) {
    cancelAnimationFrame(animFrameId);
    animFrameId = null;
  }
  
  fc.discardActiveObject();
  fc.renderAll();
  
  setRecordingProgress(true, 0, label);
  
  // Set body class to apply responsive scaling to canvas wrapper during export
  document.body.classList.add('exporting');
  
  // Disable window resize scaling during export
  window.removeEventListener('resize', updateScale);
  
  // CRITICAL: Disable retina scaling during export so backing store width and height match targetWidth and targetHeight exactly
  fc.enableRetinaScaling = false;
  
  // Set dimensions to target resolution
  fc.setDimensions({ width: targetWidth, height: targetHeight });
  fc.setZoom(targetWidth / CW);
  
  // Also resize background canvas to target resolution for high quality background renders
  bgCv.width = targetWidth;
  bgCv.height = targetHeight;
  
  // Reset animation time so export starts from the beginning frame consistently
  bgTime = 0;
  decorTime = 0;
  
  // Re-render the design to reset all elements to their starting state
  await renderDesign(designState);
  
  // Wait for settles
  await new Promise(r => setTimeout(r, 150));
  
  const candidates = [
    'video/mp4;codecs=avc1',
    'video/mp4;codecs="avc1.42E01E"',
    'video/mp4',
    'video/webm;codecs=vp9',
    'video/webm;codecs=vp8',
    'video/webm'
  ];
  
  let chosenMime = '';
  for (const candidate of candidates) {
    if (MediaRecorder.isTypeSupported(candidate)) {
      chosenMime = candidate;
      break;
    }
  }
  
  if (!chosenMime) {
    chosenMime = 'video/webm';
  }
  
  let options = { mimeType: chosenMime, videoBitsPerSecond: 15000000 };
  
  let audioTrack = null;
  let audioCtx = null;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    const dest = audioCtx.createMediaStreamDestination();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    gain.gain.value = 0.0001; // extremely quiet but non-zero to keep the audio engine rendering
    osc.connect(gain);
    gain.connect(dest);
    osc.start();
    audioTrack = dest.stream.getAudioTracks()[0];
  } catch (e) {
    console.warn("Failed to create silent audio track for export", e);
  }
  
  const canvasEl = fc.lowerCanvasEl;
  
  // Use manual frame-by-frame capture stream
  const stream = canvasEl.captureStream(0);
  const track = stream.getVideoTracks()[0];
  if (audioTrack) {
    stream.addTrack(audioTrack);
  }
  const chunks = [];
  const recorder = new MediaRecorder(stream, options);
  
  recorder.ondataavailable = e => {
    if (e.data && e.data.size > 0) chunks.push(e.data);
  };
  
  recorder.onerror = e => {
    console.error("MediaRecorder error during export:", e);
    toast('❌', `Export error: ${e.error ? e.error.name : 'Unknown error'}`, 'error');
  };
  
  const fps = 30;
  const totalFrames = 10 * fps; // 10 seconds * 30 fps = 300 frames
  let currentFrame = 0;
  
  let fallbackTimerId = null;
  const frameDuration = 1000 / fps; // 33.33ms
  
  const cleanup = () => {
    document.removeEventListener('visibilitychange', handleVisibilityChange);
    if (fallbackTimerId) {
      clearTimeout(fallbackTimerId);
      fallbackTimerId = null;
    }
    if (audioCtx) {
      try {
        audioCtx.close();
      } catch (e) {}
    }
  };

  recorder.onstop = () => {
    cleanup();
    
    const blob = new Blob(chunks, { type: options.mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const isMp4Format = options.mimeType.includes('mp4');
    a.download = `cardforge-${label.toLowerCase()}-${Date.now()}.${isMp4Format ? 'mp4' : 'webm'}`;
    a.click();
    
    // Remove exporting class
    document.body.classList.remove('exporting');
    
    // CRITICAL: Re-enable retina scaling so the on-screen display remains crisp
    fc.enableRetinaScaling = true;
    
    // Restore window resize and original scaling
    window.addEventListener('resize', updateScale);
    updateScale();
    
    // Restore background canvas to 1920x1080
    bgCv.width = 1920;
    bgCv.height = 1080;
    
    setRecordingProgress(false, 0, label);
    
    // Restore animation state
    isAnimating = wasAnimating;
    if (!isAnimating) {
      if (animFrameId) {
        cancelAnimationFrame(animFrameId);
        animFrameId = null;
      }
    } else {
      animationLoop();
    }
    toast('🎬', `Exported ${label} Video successfully!`, 'ok');
  };
  
  // Visibility change listener to handle backgrounding gracefully
  const handleVisibilityChange = () => {
    if (document.hidden) {
      if (recorder.state === 'recording') {
        recorder.pause();
        if (fallbackTimerId) {
          clearTimeout(fallbackTimerId);
          fallbackTimerId = null;
        }
        toast('⚠️', 'Export paused. Keep this tab active to resume.', 'warn');
      }
    } else {
      if (recorder.state === 'paused') {
        recorder.resume();
        fallbackTimerId = setTimeout(tickFunc, 1);
        toast('🎬', 'Resuming export...', 'ok');
      }
    }
  };
  
  document.addEventListener('visibilitychange', handleVisibilityChange);
  
  // Single unified sequential frame generation function
  const tickFunc = async () => {
    if (recorder.state === 'paused') return;
    
    currentFrame++;
    if (currentFrame >= totalFrames) {
      recorder.stop();
      return;
    }
    
    const frameStartTime = performance.now();
    
    // Advance times by (60 / fps) since original loop runs at 60fps
    const timeStep = 60 / fps;
    bgTime += bgSpeedMultiplier * timeStep;
    decorTime += decorSpeedMultiplier * timeStep;
    
    // Update background (high-quality render)
    const bgImg = fc.getObjects().find(o => o.id === 'background');
    if (bgImg && designState.bg && designState.pal) {
      renderBG(designState.bg, designState.pal, bgTime);
      bgImg.dirty = true;
    }
    
    // Update interactive floating decorations
    const objects = fc.getObjects();
    for (let i = 0; i < objects.length; i++) {
      const obj = objects[i];
      if (obj.isDecor) {
        const updates = {};
        
        // Oscillation / Hover
        if (obj.oscillate) {
          if (obj.ox === undefined) obj.ox = obj.left;
          if (obj.oy === undefined) obj.oy = obj.top;
          
          updates.left = obj.ox + (obj.dx || 0) * Math.sin(decorTime * (obj.oscillateSpeed || 0.01) + (obj.oscillatePhase || 0));
          updates.top = obj.oy + (obj.dy || 0) * Math.sin(decorTime * (obj.oscillateSpeed || 0.01) + (obj.oscillatePhase || 0));
        }
        
        // Angle Oscillation
        if (obj.oscillateAngle) {
          if (obj.baseAngle === undefined) obj.baseAngle = obj.angle || 0;
          updates.angle = obj.baseAngle + (obj.oscillateAngleRange || 10) * Math.sin(decorTime * (obj.oscillateAngleSpeed || 0.01) + (obj.oscillateAnglePhase || 0));
        }

        // Opacity Pulse
        if (obj.pulseOpacitySpeed !== undefined) {
          if (obj.baseOpacity === undefined) obj.baseOpacity = obj.opacity !== undefined ? obj.opacity : 1.0;
          updates.opacity = obj.baseOpacity * (1.0 + Math.sin(decorTime * obj.pulseOpacitySpeed + (obj.pulseOpacityPhase || 0)) * (obj.pulseOpacityRange || 0.2));
        }

        // Drift
        if (obj.vx !== undefined) {
          const currentLeft = updates.left !== undefined ? updates.left : obj.left;
          let newLeft = currentLeft + obj.vx * decorSpeedMultiplier * timeStep;
          const radius = obj.radius || Math.max(obj.width * (obj.scaleX || 1.0), obj.height * (obj.scaleY || 1.0)) / 2 || 100;
          if (newLeft > CW + radius) newLeft = -radius;
          if (newLeft < -radius) newLeft = CW + radius;
          updates.left = newLeft;
        }
        if (obj.vy !== undefined) {
          const currentTop = updates.top !== undefined ? updates.top : obj.top;
          let newTop = currentTop + obj.vy * decorSpeedMultiplier * timeStep;
          const radius = obj.radius || Math.max(obj.width * (obj.scaleX || 1.0), obj.height * (obj.scaleY || 1.0)) / 2 || 100;
          if (newTop > CH + radius) newTop = -radius;
          if (newTop < -radius) newTop = CH + radius;
          updates.top = newTop;
        }
        // Rotation
        if (obj.rotationSpeed !== undefined) {
          const currentAngle = updates.angle !== undefined ? updates.angle : obj.angle;
          updates.angle = (currentAngle + obj.rotationSpeed * decorSpeedMultiplier * timeStep) % 360;
        }
        // Scale Pulse
        if (obj.pulseSpeed !== undefined) {
          const scaleVal = obj.baseScale * (1.0 + Math.sin(decorTime * obj.pulseSpeed + obj.pulsePhase) * obj.pulseRange);
          updates.scaleX = scaleVal;
          updates.scaleY = scaleVal;
        }
        
        if (Object.keys(updates).length > 0) {
          obj.set(updates);
          obj.setCoords();
        }
      }
    }
    
    // Render the canvas
    fc.renderAll();
    
    // Wait for the render to be fully drawn and painted on the screen to avoid skipping frames
    await new Promise(r => requestAnimationFrame(r));
    
    // Capture this frame to the stream
    if (track && typeof track.requestFrame === 'function') {
      track.requestFrame();
    }
    
    // Update progress overlay
    const percent = Math.min(Math.round((currentFrame / totalFrames) * 100), 100);
    setRecordingProgress(true, percent, label);
    
    // Calculate how much time we spent on this frame
    const elapsed = performance.now() - frameStartTime;
    // We aim for exactly 33.3ms per frame. If rendering was fast, we wait out the delay to maintain 30fps.
    // If it took longer, we proceed immediately.
    const delay = Math.max(0, frameDuration - elapsed);
    
    if (recorder.state === 'recording') {
      fallbackTimerId = setTimeout(tickFunc, delay);
    }
  };
  
  recorder.start();
  
  // Capture the first frame at time = 0
  if (track && typeof track.requestFrame === 'function') {
    track.requestFrame();
  }
  
  // Start the sequential loop
  fallbackTimerId = setTimeout(tickFunc, 1);
  toast('🎬', 'Export started. Keep this tab active.', 'ok');
}

// ── MOTION ANIMATION SYSTEM ────────────────
let isAnimating = true;
let animFrameId = null;

function animationLoop() {
  if (!isAnimating) return;
  
  bgTime += bgSpeedMultiplier;
  decorTime += decorSpeedMultiplier;
  
  // 1. Update offscreen background
  const bgImg = fc.getObjects().find(o => o.id === 'background');
  if (bgImg && designState.bg && designState.pal) {
    renderBG(designState.bg, designState.pal, bgTime);
    bgImg.dirty = true;
  }
  
  // 2. Update interactive floating decorations
  const objects = fc.getObjects();
  for (let i = 0; i < objects.length; i++) {
    const obj = objects[i];
    if (obj.isDecor) {
      const updates = {};
      
      // Oscillation / Hover
      if (obj.oscillate) {
        if (obj.ox === undefined) obj.ox = obj.left;
        if (obj.oy === undefined) obj.oy = obj.top;
        
        updates.left = obj.ox + (obj.dx || 0) * Math.sin(decorTime * (obj.oscillateSpeed || 0.01) + (obj.oscillatePhase || 0));
        updates.top = obj.oy + (obj.dy || 0) * Math.sin(decorTime * (obj.oscillateSpeed || 0.01) + (obj.oscillatePhase || 0));
      }
      
      // Angle Oscillation
      if (obj.oscillateAngle) {
        if (obj.baseAngle === undefined) obj.baseAngle = obj.angle || 0;
        updates.angle = obj.baseAngle + (obj.oscillateAngleRange || 10) * Math.sin(decorTime * (obj.oscillateAngleSpeed || 0.01) + (obj.oscillateAnglePhase || 0));
      }

      // Opacity Pulse
      if (obj.pulseOpacitySpeed !== undefined) {
        if (obj.baseOpacity === undefined) obj.baseOpacity = obj.opacity !== undefined ? obj.opacity : 1.0;
        updates.opacity = obj.baseOpacity * (1.0 + Math.sin(decorTime * obj.pulseOpacitySpeed + (obj.pulseOpacityPhase || 0)) * (obj.pulseOpacityRange || 0.2));
      }

      // Drift
      if (obj.vx !== undefined) {
        const currentLeft = updates.left !== undefined ? updates.left : obj.left;
        let newLeft = currentLeft + obj.vx * decorSpeedMultiplier;
        const radius = obj.radius || Math.max(obj.width * (obj.scaleX || 1.0), obj.height * (obj.scaleY || 1.0)) / 2 || 100;
        if (newLeft > CW + radius) newLeft = -radius;
        if (newLeft < -radius) newLeft = CW + radius;
        updates.left = newLeft;
      }
      if (obj.vy !== undefined) {
        const currentTop = updates.top !== undefined ? updates.top : obj.top;
        let newTop = currentTop + obj.vy * decorSpeedMultiplier;
        const radius = obj.radius || Math.max(obj.width * (obj.scaleX || 1.0), obj.height * (obj.scaleY || 1.0)) / 2 || 100;
        if (newTop > CH + radius) newTop = -radius;
        if (newTop < -radius) newTop = CH + radius;
        updates.top = newTop;
      }
      // Rotation
      if (obj.rotationSpeed !== undefined) {
        const currentAngle = updates.angle !== undefined ? updates.angle : obj.angle;
        updates.angle = (currentAngle + obj.rotationSpeed * decorSpeedMultiplier) % 360;
      }
      // Scale Pulse
      if (obj.pulseSpeed !== undefined) {
        const scaleVal = obj.baseScale * (1.0 + Math.sin(decorTime * obj.pulseSpeed + obj.pulsePhase) * obj.pulseRange);
        updates.scaleX = scaleVal;
        updates.scaleY = scaleVal;
      }
      
      // Apply updates if any, ensuring caching is invalidated
      if (Object.keys(updates).length > 0) {
        obj.set(updates);
        obj.setCoords();
      }
    }
  }
  
  fc.requestRenderAll();
  animFrameId = requestAnimationFrame(animationLoop);
}

// ── INIT ──────────────────────────────────
async function init(){
  fc=new fabric.Canvas('main-canvas',{preserveObjectStacking:true,selection:true,backgroundColor:'#000'});
  
  updateScale();
  window.addEventListener('resize',updateScale);

  // Populate background styles dropdown
  const bgSelect = document.getElementById('bg-style-select');
  if (bgSelect) {
    bgSelect.innerHTML = BG_STYLES.map(bg => `<option value="${bg.id}">${bg.n}</option>`).join('');
  }

  // Motion speed slider listeners
  document.getElementById('motion-speed-bg').addEventListener('input', e => {
    bgSpeedMultiplier = parseFloat(e.target.value);
    document.getElementById('speed-bg-val').textContent = bgSpeedMultiplier.toFixed(1) + 'x';
  });

  document.getElementById('motion-speed-decor').addEventListener('input', e => {
    decorSpeedMultiplier = parseFloat(e.target.value);
    document.getElementById('speed-decor-val').textContent = decorSpeedMultiplier.toFixed(1) + 'x';
  });



  // Avatar upload listener
  document.getElementById('av-file').addEventListener('change',async e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=async ev=>{
      avatarURL=ev.target.result;
      document.getElementById('av-preview').src=avatarURL;
      await renderDesign(designState);
      toast('✅','Photo uploaded!');
    };
    r.readAsDataURL(f);
  });

  // Default avatar preview image source
  document.getElementById('av-preview').src=getDefaultAv({c1:'#1565C0',c2:'#0d47a1',acc:'#FFD700'});

  // Setup combo tag
  const combos=PALETTES.length*BG_STYLES.length*LAYOUTS.length*FONT_STYLES.length*DECORS.length;
  document.getElementById('combo-tag').textContent=`${(combos/1e6).toFixed(1)}M+ Combos`;

  // Start with a randomized card
  await generateAll();

  // Kickstart animation loop
  animationLoop();
}

document.fonts.ready.then(init);
</script>
</body>
</html>
